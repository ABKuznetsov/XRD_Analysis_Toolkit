[project]
name = "crystal-viewer"
version = "1.0.1"
description = "Crystal mechanics and structural degrees-of-freedom viewer for XRD, Raman and ThermoXRD."
requires-python = ">=3.11,<3.13"
dependencies = [
    "gemmi>=0.7,<1",
    "networkx>=3.3,<4",
    "numpy>=1.26,<3",
    "platformdirs>=4,<5",
    "pymatgen>=2024.5",
    "pyvista>=0.46,<0.49",
    "pyvistaqt>=0.11,<0.12",
    "PySide6>=6.7,<6.12",
    "scipy>=1.13,<2",
    "vtk>=9.3,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[project.scripts]
craft = "crystal_viewer.app:main"
crystal-viewer = "crystal_viewer.app:main"
crystal-mechanics = "crystal_viewer.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
