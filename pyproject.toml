[project]
name = "xrd-phase-finder"
version = "1.6.2"
description = "Cross-platform XRD phase finder for powder diffraction search-match workflows."
requires-python = ">=3.11,<3.13"
dependencies = [
    "certifi",
    "cristma==0.1.0b9",
    "numpy",
    "packaging",
    "pyqtgraph==0.14.0",
    "pybaselines",
    "PySide6==6.7.3",
    "rfc8785==0.1.4",
    "scipy",
]

[project.scripts]
xrd-finder = "xrd_finder.apps.finder_cli:main"
xrd-finder-gui = "xrd_finder.apps.finder_gui:main"

[tool.ruff]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "data",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["xrd_finder*"]
