[project]
name = "xrd-analysis-toolkit"
version = "1.4.1"
description = "Cross-platform XRD phase finder for powder diffraction search-match workflows."
requires-python = ">=3.11,<3.13"
dependencies = [
    "gemmi",
    "numpy",
    "pyqtgraph==0.14.0",
    "pybaselines",
    "PySide6==6.7.3",
    "rfc8785==0.1.4",
    "scipy",
]

[project.scripts]
xrd-finder = "xrd_finder.apps.finder_cli:main"
xrd-finder-gui = "xrd_finder.apps.finder_gui:main"

[tool.ruff]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "XRD_Finder/data",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "XRD_Finder"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["XRD_Finder"]
exclude = ["xrd_finder.data*"]
[tool.ruff.lint]
# Crystallographic Miller indices are conventionally written as h, k, l.
ignore = ["E741"]
